name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No `pip install` step on purpose: the suite must pass on a bare
      # interpreter, which is what enforces the zero-dependency rule.
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python build.py
      - run: python netshark.pyz --version
      - uses: actions/upload-artifact@v4
        with:
          name: netshark-pyz
          path: netshark.pyz
